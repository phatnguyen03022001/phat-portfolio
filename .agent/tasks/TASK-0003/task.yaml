structure_authority:
  status: RESOLVED
  source: "Approved portfolio design plus engineering-dossier plan at eba4529f066fbae0758eced7d0bbc24dc58e4d37"
  rationale: "Keep the existing shallow Next.js/Mongo ownership model. Add only one published-by-slug query, one case-study policy module, one constrained Markdown component, one focused case-study composition, the /work/[slug] route, tests, and bounded updates to existing work presentation/bootstrap data. No new collection, service layer, renderer registry, CMS block system, or future-slice directories are justified."

objective: "Turn the accepted Mongo-backed work index into evidence-oriented public engineering case studies with published-only slug isolation, constrained Markdown, system-owned section ordering, explicit evidence-state presentation, and no fabricated outcomes or premature owner/media/integration infrastructure."

scope:
  required_changes:
    - "Fresh-bind TASK-0003 revision 1 at the exact handoff base on dev before mutation. Prove repository identity, branch dev, exact base HEAD, remote main unchanged, dev/main-only topology, and all required EXECUTION capabilities."
    - "Add current stable compatible react-markdown as the only new runtime dependency. Do not add rehype-raw, MDX, another Markdown parser, a CMS/page-builder framework, or unrelated UI dependencies."
    - "Add src/content/case-study.ts owning exactly the approved case-section ordering and an explicit Markdown URL policy. Allow relative/hash links plus http, https, and mailto; javascript, data, file, vbscript and other unapproved schemes must not become active links."
    - "Tighten structured URL validation in the existing Zod model: repository references accept HTTP(S) only; general external/contact links accept only the explicitly approved safe schemes required by current content. Preserve current valid bootstrap data."
    - "Add a server-renderable MarkdownContent component using react-markdown. Raw HTML/scripts/iframes/inline handlers must not execute; do not enable rehype-raw or arbitrary component/MDX execution. The renderer must support the basic approved CommonMark surfaces: prose, headings, lists, emphasis, links, inline/fenced code and blockquotes."
    - "Add getPublishedWorkBySlug(slug) to the existing Mongo query boundary. The Mongo predicate must include publicationStatus=PUBLISHED and the persisted result must pass workItemSchema parsing. Draft, missing and malformed behavior must fail closed as specified by the plan."
    - "Enrich only the two existing bootstrap WorkItem records with the narrow approved OVERVIEW and KNOWN_LIMITATIONS sections defined verbatim in the engineering-dossier plan. Do not add responsibility, outcome, operations, metrics, users, customers, revenue, deployment, production-operation or performance claims. Evidence arrays may remain empty until independently supported records are available."
    - "Add a focused WorkCaseStudy public composition rendering work identity/category/summary, structured repository references, canonically ordered sections through MarkdownContent, explicit evidence states when records exist, technologies/external links when present, and an honest empty evidence state when no evidence records are published. Never generate synthetic scores, maturity percentages or readiness ratings."
    - "Add /work/[slug] as an async Server Component using the published-by-slug query and notFound() for non-public/missing records. Keep request-time rendering so build remains independent of a live Mongo endpoint. Add truthful per-case metadata from the work title/summary without claiming deployment/operation status."
    - "Update /work and selected-work presentation so published cards link with normal Next.js links to /work/<slug>. Preserve the accepted public visual hierarchy and server-first behavior."
    - "Use existing global CSS patterns; modify src/app/globals.css only for focused case-study/readability styles that are actually used. Do not create a design-system package, theme subsystem, animation framework, or client interaction layer."
    - "Write TDD-backed tests for canonical section ordering, safe Markdown URL behavior, raw-HTML/unsafe-link non-execution, structured URL validation, server-rendered case-study behavior, and real-Mongo published/draft/missing/malformed slug isolation. Use the existing Vitest/mongodb-memory-server-core stack; do not add another test runner or browser framework in this slice."
    - "Run pnpm lint, pnpm typecheck, pnpm test, pnpm build and pnpm verify. Record the actual local Node version truthfully; preserve package engines.node=24.x and do not claim exact Node-24 execution unless the checks actually run on Node 24.x."
    - "Run production-server smoke against seeded ephemeral Mongo and prove /work plus both approved published case slugs return 200, a synthetic draft slug returns 404, a missing slug returns 404, no runtime error marker appears, and rendered content contains no active unsafe Markdown/raw-HTML execution surface."
    - "Inspect the exact implementation candidate diff and prove there is no Better Auth/admin UI/Cloudinary/MediaAsset persistence/GitHub API integration/contact backend/analytics/Three.js/3D/video/Redis/queue/event-bus/microservice/separate-backend/client-fetching/theme subsystem/main mutation or unrelated refactor."
    - "Commit the coherent implementation candidate as the direct child of the exact handoff base, push non-force to dev, create the canonical TASK-0003 report as the report-only direct child, push non-force, fresh-prove final remote/local/main/topology state, and stop NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - package.json
    - pnpm-lock.yaml
    - src/content/model.ts
    - src/content/model.test.ts
    - src/content/queries.ts
    - src/content/queries.integration.test.ts
