acceptance_criteria:
  - id: AC-1
    requirement: "Case-study Markdown is constrained, server-renderable, and non-executable outside the approved content grammar."
    evidence_required: "Exact dependency/source/tests prove react-markdown is the only new runtime rendering dependency; raw HTML/scripts/iframes do not execute; unsafe schemes do not become active href values; approved CommonMark surfaces render; no rehype-raw/MDX/arbitrary component execution or Client Component is introduced."
  - id: AC-2
    requirement: "Public work-detail lookup is Mongo-backed, runtime-validated, deterministic and draft-safe."
    evidence_required: "Real-Mongo integration tests prove published slug returns validated WorkItem, draft and missing slugs return null/not-found, malformed published content fails closed, and the Mongo predicate includes publicationStatus=PUBLISHED."
  - id: AC-3
    requirement: "The public dossier presents engineering evidence honestly using the existing WorkItem model."
    evidence_required: "WorkCaseStudy renders structured repository references, canonically ordered approved sections, explicit evidence-state labels when records exist, honest empty-evidence behavior when none exist, and no synthetic score/readiness UI or new Project/System/content collection."
  - id: AC-4
    requirement: "The two current flagship case studies become navigable without fabricated proof or later-slice infrastructure."
    evidence_required: "/work links to both approved case slugs; seeded production smoke returns 200 for both published cases and 404 for draft/missing cases; bootstrap enrichment contains only the exact bounded OVERVIEW/KNOWN_LIMITATIONS content authorized by the plan; no unsupported outcome/responsibility/operation claims or auth/admin/media/GitHub/contact-backend/analytics/3D infrastructure appears."
  - id: AC-5
    requirement: "The dossier slice remains maintainable, server-first, accessible by construction, and deterministically verifiable."
    evidence_required: "pnpm lint, typecheck, test, build and verify pass; production smoke passes against ephemeral seeded Mongo; source scan shows no use-client/client fetching; focused semantic headings/links are rendered; exact diff is bounded and git diff --check passes."
  - id: AC-6
    requirement: "Publication remains bounded to dev and independently reviewable."
    evidence_required: "Implementation candidate is the direct child of exact handoff base; canonical report is the report-only direct child; both are pushed non-force to dev; remote main remains 4f6f466ed3153c48c29e53d1bd23ffce289097e3; repository topology remains exactly dev/main; Executor stops NEEDS_REVIEW."

verification:
  authoritative_verification:
    required: false
    rationale: "This slice adds public rendering and a content-safety boundary but no privileged mutation, external provider write, or production deployment. Focused unit/server-render tests, official-driver real-Mongo integration, production-route smoke, exact diff/ref proof and dependency inspection are sufficient."
  required_checks:
    - "pnpm lint"
    - "pnpm typecheck"
    - "pnpm test"
    - "pnpm build"
    - "pnpm verify"
    - "Real-Mongo integration tests through mongodb-memory-server-core for published/draft/missing/malformed slug behavior"
    - "Server-render Markdown safety tests for raw HTML and unsafe URL schemes"
    - "Production next start smoke for /work, both approved case slugs, synthetic draft 404 and missing 404 against seeded ephemeral Mongo"
    - "Exact diff/dependency/client-boundary inspection plus git diff --check"

