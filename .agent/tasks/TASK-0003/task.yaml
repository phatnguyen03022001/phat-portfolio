    - src/app/globals.css
    - .agent/tasks/TASK-0003/report.yaml
  expected_files_are_restrictive: true

invariants:
  - "dev is the only implementation branch for this task; main remains stable and unchanged."
  - "WorkItem remains the sole work/project/system content model; no new first-class portfolio collection is introduced."
  - "Public detail lookup enforces publicationStatus=PUBLISHED at the Mongo boundary; draft case studies are never anonymously visible."
  - "Case-study section ordering is system-owned and uses only the approved section-kind enum."
  - "Markdown is constrained content, not an executable extension system. Raw HTML, unsafe schemes, MDX imports and arbitrary components remain disabled."
  - "Evidence states remain distinct and are never converted into a percentage, maturity score or synthetic readiness rating."
  - "Only the two approved current flagship candidates receive bootstrap case content, and only the bounded claims explicitly authorized by the plan are added."
  - "Public pages remain Server Components by default and content remains usable without client JavaScript/WebGL."
  - "The accepted TASK-0002 Mongo boundary remains direct official-driver persistence with no ODM/service abstraction."
  - "No support repository mutation is authorized."

forbidden_changes:
  - "Do not modify main, create/delete/rename branches, force-push, promote, tag, release or deploy production."
  - "Do not add Better Auth, authentication, owner/admin routes, organizations, RBAC, Cloudinary, MediaAsset persistence, GitHub API integration, email/contact providers, analytics, Three.js, React Three Fiber, GLB assets, video tooling, Redis, queues, event buses, microservices, a separate backend API, CMS framework, page builder, generic renderer/provider registry, or Docker orchestration."
  - "Do not add rehype-raw, MDX, arbitrary Markdown components, raw HTML execution, unsafe URL schemes, public client-side data fetching, SWR, React Query, or a use-client boundary for dossier rendering."
  - "Do not add a theme provider, persisted theme state, theme toggle, animation framework, or design-system package."
  - "Do not invent responsibility, outcomes, customers, revenue, users, metrics, seniority, deployment, production-operation, performance gains or commercial flagship proof."
  - "Do not modify the approved design spec, TASK-0001/TASK-0002 evidence, or this task during execution. Material architecture/spec changes require revised Architect authority."

