    - STALE_STATE
    - AUTHORITY_REQUIRED
    - CURRENT_PHASE_CAPABILITY_UNAVAILABLE
    - REVIEW_REQUIRED
    - REVERIFY_REQUIRED
    - USER_STOP

acceptance_criteria:
  - id: AC-1
    requirement: "A current secure Next.js public application foundation exists without overwriting repository authority."
    evidence_required: "Exact package/lock/config diff shows Node 24.x, pnpm, TypeScript, App Router, src/, Tailwind and Next.js 16.x at or above 16.3.3; README/docs/.agent authority is preserved; pnpm lint, typecheck and build pass."
  - id: AC-2
    requirement: "shadcn/ui is present only as a narrow primitive layer while global CSS owns the brand presentation."
    evidence_required: "components.json plus the immediately used Button primitive exist; globals.css owns the editorial tokens, light/dark system treatment, focus state and reduced-motion behavior; no broad unused primitive set or theme subsystem is introduced."
  - id: AC-3
    requirement: "The public information architecture communicates the approved positioning without fabricated proof."
    evidence_required: "/, /work, /about and /contact render the approved identity and hierarchy; only IELTS and the governed agentic engineering system appear as current evidence-backed flagship candidates; no completed commercial flagship or invented outcomes/metrics appear."
  - id: AC-4
    requirement: "The first slice remains server-first and excludes later infrastructure."
    evidence_required: "Diff inspection proves no MongoDB/Auth/Cloudinary/GitHub import/contact API/analytics/Three.js/3D/video/backend/Redis/queue/event-bus/CMS additions and no unjustified Client Component; any required use-client file has a concrete report rationale."
  - id: AC-5
    requirement: "The public shell is reviewably accessible and responsive."
    evidence_required: "Production route smoke returns 200 for all four public routes; representative narrow/wide inspection shows no horizontal overflow or obvious keyboard focus/contrast/readability regression; reduced-motion CSS exists; pnpm verify passes."
  - id: AC-6
    requirement: "Publication is bounded to dev and independently reviewable."
    evidence_required: "Implementation candidate is the direct child of exact handoff base; canonical report is the report-only direct child; both are pushed non-force to dev; remote main remains 4f6f466ed3153c48c29e53d1bd23ffce289097e3; repository topology remains exactly dev/main; Executor stops NEEDS_REVIEW."

