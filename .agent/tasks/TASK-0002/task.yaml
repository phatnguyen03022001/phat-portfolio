    rationale: "This slice introduces a material data boundary but no privileged mutation or production deployment. Deterministic schema tests, official-driver ephemeral Mongo integration tests, production-route smoke, exact diff inspection, and ref proof are sufficient; a separate designated verifier is not required."
  required_checks:
