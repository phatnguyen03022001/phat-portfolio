acceptance_criteria:
  - id: AC-1
    requirement: "The application has one bounded official-driver MongoDB persistence boundary without an ODM or second backend."
    evidence_required: "Exact dependency/config/source diff shows current compatible mongodb + zod, centralized MongoClient reuse, MONGODB_URI server-only configuration, no Mongoose/ODM/database framework, and passing lint/typecheck/build."
  - id: AC-2
    requirement: "SiteProfile and WorkItem are explicit, bounded, runtime-validated editorial documents with only currently justified indexes."
    evidence_required: "Schema tests and exact source inspection prove schemaVersion=1, approved enums/embedded structures, finite array bounds, unique work slug, publicationStatus+collection+featuredRank, publicationStatus+currentRank, and no MediaAsset collection or generic page-builder/history model."
  - id: AC-3
    requirement: "MongoDB is the runtime editorial source for the existing public portfolio and draft content fails closed."
    evidence_required: "Public query integration tests use an ephemeral real MongoDB process through the official driver, published reads are deterministic, DRAFT work is excluded at the query boundary, malformed persisted data is rejected, existing public routes consume typed Mongo reads, and src/content/fixtures.ts is no longer a runtime source/fallback."
  - id: AC-4
    requirement: "Existing positioning and evidence integrity survive persistence migration without pulling future product slices forward."
    evidence_required: "Seeded production-server smoke shows Nguyen Tien Phat / Software Engineer / AI-native Products & Agentic Systems and exactly Knowledge-first IELTS Learning System plus Governed Agentic Engineering System; no commercial flagship or fabricated proof appears; no auth/admin/media/GitHub/contact-backend/analytics/3D infrastructure exists."
  - id: AC-5
    requirement: "The persistence slice is deterministically verifiable without operator-managed Atlas or Docker infrastructure."
    evidence_required: "pnpm lint, pnpm typecheck, pnpm test, pnpm build, and pnpm verify pass; mongodb-memory-server-core integration proof succeeds; production HTTP smoke returns 200 for /, /work, /about and /contact against ephemeral seeded Mongo; a synthetic draft is absent from rendered public output; no browser/runtime error attributable to the slice remains."
  - id: AC-6
    requirement: "Publication remains bounded to dev and independently reviewable."
    evidence_required: "Implementation candidate is the direct child of exact handoff base; canonical report is the report-only direct child; both are pushed non-force to dev; remote main remains 4f6f466ed3153c48c29e53d1bd23ffce289097e3; repository topology remains exactly dev/main; Executor stops NEEDS_REVIEW."

