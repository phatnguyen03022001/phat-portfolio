    - AUTHORITY_REQUIRED
    - CURRENT_PHASE_CAPABILITY_UNAVAILABLE
    - REVIEW_REQUIRED
    - REVERIFY_REQUIRED
    - USER_STOP

acceptance_criteria:
  - id: AC-1
    requirement: "WorkItem mutation lifecycle is bounded, schema-valid and non-destructive."
    evidence_required: "Source plus real-Mongo tests prove DRAFT-only create, duplicate rejection, immutable slug, draft-only content edit, explicit publish/unpublish timestamps and no delete/revision subsystem."
  - id: AC-2
    requirement: "Every persistent editorial mutation is protected by the accepted immutable-owner authorization boundary."
    evidence_required: "Source/tests prove create/update/publish/unpublish all require the TASK-0004 live session plus linked immutable GitHub owner account before Mongo mutation; anonymous/wrong-owner paths leave data unchanged."
  - id: AC-3
    requirement: "The protected admin work UI exposes the lifecycle honestly without pulling future infrastructure forward."
    evidence_required: "Admin route/component evidence proves list/new/edit screens; published content is read-only except unpublish; draft content is editable/publishable; slug is create-only; SiteProfile/media remain read-only; no delete/future-slice UI exists."
  - id: AC-4
    requirement: "Publishing state remains the single public visibility boundary."
    evidence_required: "Real-Mongo and production-route evidence proves DRAFT is absent/404 publicly, publish makes the item visible through existing public queries/routes, unpublish removes it again, and public reads still filter PUBLISHED at Mongo boundary."
  - id: AC-5
    requirement: "Verification is deterministic, server-first and secret-safe."
    evidence_required: "lint, typecheck, tests, build, verify and diff-check pass; actual Node version is recorded; ephemeral-Mongo lifecycle tests and server smoke pass; browser/static/source scans show no sensitive leakage, client data cache or unauthorized service/dependency expansion."
  - id: AC-6
    requirement: "Execution cleanup respects process/resource ownership."
    evidence_required: "Only positively identified task-owned resources are cleaned; Agent Runtime/tunnel/parent/shared processes are never signaled, killed, restarted or reconfigured."
  - id: AC-7
    requirement: "Publication remains bounded to dev and independently reviewable."
    evidence_required: "Candidate is direct child of exact base; report is report-only direct child; both pushed non-force to dev; main remains 4f6f466ed3153c48c29e53d1bd23ffce289097e3; topology remains dev/main; Executor stops NEEDS_REVIEW."

verification:
  authoritative_verification:
    required: false
    rationale: "This is an owner-only editorial mutation boundary but not an auth redesign, migration, external-provider write or production deployment. Adversarial owner-gate tests, real-Mongo lifecycle proof, production-route smoke, exact diff inspection and independent Architect review are sufficient."
  required_checks:
    - "pnpm lint"
    - "pnpm typecheck"
    - "pnpm test"
    - "pnpm build"
    - "pnpm verify"
    - "git diff --check"
    - "Real-Mongo WorkItem draft/edit/publish/unpublish lifecycle tests"
    - "Owner-authorization negative mutation tests"
    - "Production/server smoke for public draft/published isolation and owner lifecycle"
    - "Browser/static secret-leak and exact forbidden-diff inspection"
    - "Task-owned process/resource cleanup proof"

