structure_authority:
  status: RESOLVED
  source: "Approved portfolio design plus work-editorial-publishing plan at b371677219319783a2eb4d302ba813d15ab37038"
  rationale: "Extend the existing WorkItem content owner and protected admin work surface only. Add no new first-class collection, API service, revision store, CMS framework or provider layer."

objective: "Give the authenticated owner a bounded WorkItem draft/create/edit/publish/unpublish workflow while preserving immutable slugs, published-only anonymous reads, the accepted owner-security boundary and strict deferral of destructive/future infrastructure."

scope:
  required_changes:
    - "Fresh-bind TASK-0005 revision 1 at the exact canonical handoff base on dev and prove current repository/branch/base/main/topology plus required EXECUTION capabilities before mutation."
    - "Implement the approved work-editorial-publishing plan without adding a runtime dependency."
    - "Create WorkItems only as DRAFT with publishedAt=null; reject duplicate slugs without overwriting existing data; slug is immutable after creation."
    - "Allow content mutation only while the persisted WorkItem is DRAFT. A PUBLISHED WorkItem must reject content edits until explicitly unpublished."
    - "Publish only an existing validated DRAFT and set publicationStatus=PUBLISHED with publishedAt equal to the mutation time; unpublish only an existing validated PUBLISHED item and set publicationStatus=DRAFT with publishedAt=null."
    - "Every persistent mutation must cross the accepted TASK-0004 live owner session plus immutable linked-GitHub-account authorization boundary before changing Mongo state. Cookie presence or authentication alone is insufficient."
    - "Use the existing direct official MongoDB driver owner and existing WorkItem schema/enums/limits. Final documents must pass workItemSchema before persistence. No ODM, generic repository/service framework or second work collection."
    - "Add protected admin work screens for list, new draft and existing item editing. Published items are read-only except explicit unpublish; drafts expose bounded editing and explicit publish. No delete operation exists."
    - "Support the existing WorkItem editorial surfaces needed by current case studies: core metadata, repository references, case-study sections, evidence records, technologies and external links. Preserve constrained Markdown and evidence-state semantics without synthetic scores/claims."
    - "Keep SiteProfile/profile admin and Media admin read-only in this task. Do not pull Cloudinary/MediaAsset or GitHub import forward."
    - "Use native server-side mutation handling and bounded validation errors; do not expose auth/session/provider/Mongo secrets or raw database errors to browser output."
    - "Use TDD plus real ephemeral Mongo evidence for duplicate-slug, draft edit, published-edit rejection, publish visibility, unpublish visibility, missing/malformed fail-closed and owner authorization predicates."
    - "Run lint, typecheck, tests, production build, repository verify and git diff --check; truthfully record the actual Node version and preserve engines.node=24.x."
    - "Run production/server smoke with ephemeral Mongo and synthetic TASK-0004 auth configuration proving published public visibility, draft public absence, anonymous mutation rejection and the complete owner-authorized draft/edit/publish/unpublish lifecycle."
    - "Agent Runtime, secure tunnel, parent execution transport and shared operator infrastructure are never task-owned. Cleanup only positively identified task-owned processes/resources; never kill/restart/reconfigure shared infrastructure."
    - "Publish one coherent implementation candidate as direct child of exact base, then one report-only direct child; push non-force to dev, fresh-prove remote/local/main/topology and stop NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - src/content/
    - src/app/admin/(protected)/work/
    - src/components/admin/
    - src/app/globals.css
    - README.md
    - .agent/tasks/TASK-0005/report.yaml
  expected_files_are_restrictive: true

invariants:
  - "dev is the only implementation branch; main remains unchanged."
  - "WorkItem remains the sole work/project/system model and MongoDB official driver remains the persistence mechanism."
  - "New records are DRAFT only; published records cannot be content-edited directly; slug cannot change after creation; deletion is absent."
  - "Every mutation is owner-authorized through the accepted TASK-0004 live session plus immutable linked-account check."
  - "Anonymous public queries remain PUBLISHED-only at the Mongo boundary."
  - "SiteProfile mutation, media, GitHub import, contact backend, analytics and 3D remain deferred."
  - "Agent Runtime/tunnel/parent/shared operator infrastructure are never task-owned cleanup targets."

forbidden_changes:
  - "Do not modify main, create/delete/rename branches, force-push, promote, tag, release or deploy production."
  - "Do not change TASK-0004 authentication/authorization semantics or weaken CSRF/origin/session protections."
  - "Do not add delete, bulk destructive mutation, slug rename/redirect history, autosave, revisions/version tables, scheduled publishing, collaboration, approval roles, RBAC, organizations or another auth/data framework."
  - "Do not add SiteProfile mutation, Cloudinary/MediaAsset persistence, uploads, GitHub import, email/contact providers, analytics, 3D/video, Redis, queues, event buses, microservices, separate backend, CMS/page-builder or theme subsystem."
  - "Do not expose sensitive auth/provider/session/Mongo values in browser code, committed content, logs or report prose."
  - "Do not terminate/restart/signal/reconfigure Agent Runtime, secure tunnel, parent transport or unrelated operator processes."
  - "Do not modify the approved spec, accepted prior-task evidence or this task during execution. Material security/schema/public-contract/dependency changes require revised Architect authority."

gap_policy:
  local_auto_fix: true
