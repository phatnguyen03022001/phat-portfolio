    rationale: "The slice is security-sensitive, so adversarial negative predicates, real-Mongo adapter integration, secret-leak inspection, production-route smoke and trigger-expanded Architect review are mandatory. Live provider/deployment assurance remains a later activation boundary rather than fabricated local evidence."
