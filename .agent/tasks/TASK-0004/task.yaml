acceptance_criteria:
  - id: AC-1
    requirement: "Better Auth is integrated through the accepted Mongo ownership and bounded server-only runtime configuration."
    evidence_required: "Exact dependency/config/db/auth diff plus ephemeral-Mongo integration proves Better Auth core + official Mongo adapter only, one centralized Mongo ownership, controlled runtime failure, build independence, and no second auth/data service."
  - id: AC-2
    requirement: "Only the configured immutable GitHub owner identity can enter and satisfy owner authorization."
    evidence_required: "Negative and positive tests plus source inspection prove immutable GitHub provider-id admission and independent live-session plus linked-account authorization; wrong provider/id/user, absent id and mutable-profile-only matches fail closed."
  - id: AC-3
    requirement: "The approved admin shell is protected server-side and remains read-only."
    evidence_required: "Production smoke and source prove anonymous sign-in access, unauthorized redirects for all four protected admin destinations, real server session/account validation, GitHub-only sign-in, and absence of mutation/account-management UI."
  - id: AC-4
    requirement: "Auth remains isolated from public routes and later V1 slices."
    evidence_required: "Representative public route smoke remains anonymous; exact diff/browser scan proves no sensitive runtime leakage, cookie-only security, editorial/media/GitHub-import/analytics/3D/backend/role-framework expansion."
  - id: AC-5
    requirement: "Security-focused verification is deterministic and truthful without fabricated live-provider evidence."
    evidence_required: "lint, typecheck, tests, build, verify and diff-check pass; real-Mongo auth integration and owner-policy negative tests pass; production smoke passes; actual Node version is recorded; live GitHub callback is claimed only if truly exercised."
  - id: AC-6
    requirement: "Execution cleanup respects task process ownership."
    evidence_required: "No Agent Runtime/tunnel/parent/shared-process termination or restart occurs; cleanup is limited to positively identified task-owned resources."
  - id: AC-7
    requirement: "Publication remains bounded to dev and independently reviewable."
    evidence_required: "Candidate is direct child of exact base; report is report-only direct child; both are pushed non-force to dev; main remains 4f6f466ed3153c48c29e53d1bd23ffce289097e3; topology remains dev/main; Executor stops NEEDS_REVIEW."

